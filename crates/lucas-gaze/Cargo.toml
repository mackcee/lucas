[package]
name = "lucas-gaze"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Camera, Landmarker, and GazeSource traits, capture, landmarks, features, and calibration."
publish = false

[features]
default = ["ort", "camera"]
ort = ["dep:ort"]
camera = ["dep:nokhwa", "dep:nokhwa-bindings-windows", "dep:thread-priority", "dep:windows"]

[dependencies]
lucas-core = { path = "../lucas-core" }
lucas-geometry = { path = "../lucas-geometry" }
sha2 = "0.10.9"
zeroize = "1.8.2"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
nalgebra = { version = "0.34.1", default-features = false, features = ["std"] }
ort = { version = "=2.0.0-rc.14", optional = true, default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-31"] }

[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10.11", optional = true, default-features = false, features = ["input-msmf"] }
nokhwa-bindings-windows = { version = "=0.4.6", optional = true }
thread-priority = { version = "3.0.0", optional = true }
windows = { version = "0.62.2", optional = true, features = ["Win32_Media_MediaFoundation"] }

[dev-dependencies]
cpu-time = "1.0.0"

[[bench]]
name = "pipeline"
harness = false
required-features = ["ort"]
