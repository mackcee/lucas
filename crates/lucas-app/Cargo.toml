[package]
name = "lucas-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tray application and UI entry point."
publish = false

[[bin]]
name = "lucas"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_plot = "0.37.0"
lucas-core = { path = "../lucas-core" }
lucas-store = { path = "../lucas-store" }
lucas-overlay = { path = "../lucas-overlay" }
lucas-game = { path = "../lucas-game" }
lucas-gaze = { path = "../lucas-gaze", default-features = false }
lucas-geometry = { path = "../lucas-geometry" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10.9"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
lucas-gaze = { path = "../lucas-gaze", features = ["camera", "ort"] }
eframe = { version = "0.36.0", default-features = false, features = ["accesskit"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }
cpu-time = "1.0"
winit = { version = "0.30.13", default-features = false }
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
tiny-skia = { version = "0.11.4", features = ["png-format"] }
