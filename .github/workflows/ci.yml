name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-checks:
    # Keep these job names stable: they are intended to be required PR checks.
    name: Linux / format, lint, tests, dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust toolchain and components
        # rustup reads rust-toolchain.toml, including rustfmt and clippy.
        run: rustup show
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache ONNX Runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ort-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Reserve model-file cache
        # Never cache source or notices; see models/README.md for asset provenance.
        # Model manifests/conversion tooling must live in models/ or xtask/ so edits
        # invalidate this key. Do not fall back to an older set of model files.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            models/**/*.onnx
            models/**/*.tflite
            models/**/*.task
          key: models-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('models/**', 'xtask/**', 'Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Test UniGaze setup integrity and IPC without GPU or downloads
        run: python3 -m unittest discover -s models/unigaze -p 'test_*.py'
      - name: Check dependency advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          command: check

  windows-msvc:
    name: Windows / MSVC build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Apply MSVC to both build and test, regardless of the runner's default.
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust MSVC toolchain and components
        run: |
          rustup set default-host x86_64-pc-windows-msvc
          rustup show
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-msvc
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache ONNX Runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ort-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Reserve model-file cache
        # Same asset-cache constraints and key inputs as Linux above.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            models/**/*.onnx
            models/**/*.tflite
            models/**/*.task
          key: models-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('models/**', 'xtask/**', 'Cargo.lock') }}
      - name: Build workspace with MSVC
        run: cargo build --workspace --all-targets
      - name: Test workspace with MSVC
        run: cargo test --workspace
      - name: Build ready-to-run diagnostics executable
        run: cargo build --locked --release -p lucas-app
      - name: Package and smoke-test the unpacked Windows bundle
        timeout-minutes: 3
        shell: pwsh
        run: ./xtask/package-windows.ps1 -OutputDirectory "${{ runner.temp }}/lucas-package"
      - name: Upload ready-to-run Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lucas-windows-x64
          path: ${{ runner.temp }}/lucas-package/lucas-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-test overlay on the interactive desktop
        timeout-minutes: 3
        env:
          LUCAS_OVERLAY_ARTIFACT_DIR: ${{ runner.temp }}/lucas-overlay-smoke
        run: cargo test -p lucas-overlay --test windows_smoke windows_overlay_smoke -- --ignored --exact --nocapture
      - name: Upload overlay smoke screenshots (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overlay-smoke-windows
          path: ${{ runner.temp }}/lucas-overlay-smoke/*.png
          if-no-files-found: warn
          retention-days: 14
