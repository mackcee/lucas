[workspace]
members = ["crates/*", "xtask"]
exclude = ["vendor/nokhwa-bindings-windows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mackcee/lucas"

# Add shared dependencies here only when a member actually needs them.
[workspace.dependencies]

[patch.crates-io]
nokhwa-bindings-windows = { path = "vendor/nokhwa-bindings-windows" }
