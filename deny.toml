[advisories]
# Consult the RustSec advisory database with explicitly approved exceptions.
version = 2
ignore = [
    # Unmaintained paste has no safe upgrade; required by nokhwa and nalgebra/simba.
    "RUSTSEC-2024-0436",
]
unmaintained = "all"
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.95
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    # Permissive data licence of webpki-roots via ONNX Runtime build tooling.
    "CDLA-Permissive-2.0",
]

# egui's bundled fonts: redistribution notices are retained in
# crates/lucas-app/licenses/. Keep this scoped to the font package.
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal, non-published workspace crates use path-only dependencies.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
